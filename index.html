  function backgroundTool(){view.innerHTML=`<div class="v79-page v79-tool-page">${toolHeader('Remove Background','Détourage local et export PNG à la résolution source.')}<div class="v79-tool-shell v79-bg-shell"><aside class="v79-glass v79-controls"><h3>Détourage</h3><span class="v79-field-label">Image source</span><label class="v79-file-picker"><input type="file" accept="image/*" data-bg-file><span class="v79-file-picker-icon">＋</span><span><b>Choisir une image</b><small>PNG, JPG ou WEBP</small></span></label><label class="v79-field v79-threshold"><span>Tolérance du fond</span><span class="v79-range"><input type="range" min="5" max="180" value="42" data-bg-threshold><output>42</output></span></label><p class="v79-help">GRID analyse la couleur des quatre coins et rend progressivement les pixels similaires transparents.</p><button class="v79-btn primary" data-bg-download disabled>Télécharger sans fond</button></aside><section class="v79-glass v79-preview v79-bg-preview"><div class="v79-drop" data-bg-drop><b>Ajoutez une image</b><span>Privilégiez un fond uni pour un résultat propre.</span></div><canvas class="v79-canvas" data-bg-canvas hidden></canvas></section></div></div>`;replay();const file=$('[data-bg-file]',view),range=$('[data-bg-threshold]',view),canvas=$('[data-bg-canvas]',view),ctx=canvas.getContext('2d',{willReadFrequently:true}),download=$('[data-bg-download]',view);let source=null,frame=0;function process(){if(!source)return;ctx.putImageData(source,0,0);const data=ctx.getImageData(0,0,canvas.width,canvas.height),d=data.data,w=canvas.width,h=canvas.height,corners=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([x,y])=>{const i=(y*w+x)*4;return[d[i],d[i+1],d[i+2]]}),base=corners.reduce((acc,color)=>acc.map((v,i)=>v+color[i]/4),[0,0,0]),threshold=+range.value;for(let i=0;i<d.length;i+=4){const distance=Math.hypot(d[i]-base[0],d[i+1]-base[1],d[i+2]-base[2]);if(distance<threshold)d[i+3]=Math.round(255*Math.max(0,distance/threshold))}ctx.putImageData(data,0,0)}range.addE   function openDashboardDetails(data,periodLabel){openModal(`<div class="v79-modal-head"><div><span class="v79-kicker">DÉTAIL FINANCIER · ${periodLabel.toUpperCase()}</span><h2>Résultat global</h2></div><button class="v79-close" data-v79-close>×</button></div><div class="dashboard-detail-summary"><article><span>Revenus</span><b>${euro.format(data.revenue)}</b></article><article><span>Dépenses</span><b>${euro.format(data.expense)}</b></article><article><span>Profit</span><b class="${data.profit>=0?'positive':'negative'}">${euro.format(data.profit)}</b></article></div><div class="dashboard-detail-list">${data.moves.length?[...data.moves].reverse().map(move=>`<article><i class="${move.type}"></i><span><b>${esc(move.label||'Mouvement')}</b><small>${new Date(`${move.date}T12:00:00`).toLocaleDateString('fr-FR')}</small></span><strong>${move.type==='revenue'?'+':'-'}${euro.format(move.amount)}</strong></article>`).join(''):'<div class="dashboard-empty-row">Aucun mouvement sur cette période.</div>'}</div>`,modal=>$('.v79-modal-card',modal).classList.add('dashboard-detail-modal'))}
  /* Dashboard sans rechargement — mise à jour ciblée */
  function dashboardGraph(points){if(!points.length)return`<div class="dashboard-empty-chart"><span>Aucun mouvement sur cette période</span><small>Ajoutez un revenu ou une dépense depuis le calendrier.</small></div>`;let running=0;const cumulative=points.map(([date,value])=>({date,value,total:running+=value})),values=cumulative.map(item=>item.total),deltas=cumulative.map(item=>Math.abs(item.value)),min=Math.min(0,...values),max=Math.max(0,...values),range=max-min||1,maxDelta=Math.max(1,...deltas),coords=cumulative.map((item,index)=>({x:34+index*(632/Math.max(1,cumulative.length-1)),y:145-((item.total-min)/range)*99,...item}));let curve=`M ${coords[0].x} ${coords[0].y}`;for(let index=1;index<coords.length;index++){const previous=coords[index-1],point=coords[index],middle=(previous.x+point.x)/2;curve+=` C ${middle} ${previous.y}, ${middle} ${point.y}, ${point.x} ${point.y}`}const area=`${curve} L ${coords.at(-1).x} 158 L ${coords[0].x} 158 Z`,step=Math.max(1,Math.ceil(coords.length/7));return`<div class="dashboard-plot"><svg class="dashboard-chart" viewBox="0 0 700 188" preserveAspectRatio="none" role="img" aria-label="Évolution du résultat"><defs><linearGradient id="dashboardAreaSmooth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c9df0" stop-opacity=".22"/><stop offset=".82" stop-color="#2c9df0" stop-opacity=".025"/><stop offset="1" stop-color="#2c9df0" stop-opacity="0"/><filter id="dashboardGlow"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path class="dashboard-grid" d="M34 46H666M34 96H666M34 145H666"/>${coords.map(point=>{const height=12+Math.abs(point.value)/maxDelta*42,y=158-height;return`<rect class="dashboard-volume ${point.value<0?'negative':''}" x="${point.x-2}" y="${y}" width="4" height="${height}" rx="2"/>`}).join('')}<path d="${area}" fill="url(#dashboardAreaSmooth)"/><path d="${curve}" class="dashboard-line dashboard-line-glow"/><path d="${curve}" class="dashboard-line"/>${coords.map((point,index)=>`<g class="dashboard-point"><circle cx="${point.x}" cy="${point.y}" r="7" class="dashboard-point-hit"/><circle cx="${point.x}" cy="${point.y}" r="1.8"/><foreignObject x="${Math.max(4,Math.min(606,point.x-47))}" y="${Math.max(2,point.y-53)}" width="94" height="44"><div class="dashboard-tooltip"><b>${euro.format(point.total)}</b><small>${new Date(`${point.date}T12:00:00`).toLocaleDateString('fr-FR')}</small></div></foreignObject>${index%step===0||index===coords.length-1?`<text x="${point.x}" y="181" text-anchor="middle" class="dashboard-axis-label">${new Date(`${point.date}T12:00:00`).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}</text>`:''}</g>`).join('')}</svg></div>`}
  function dashboardActivityHtml(data){return data.moves.length?[...data.moves].reverse().slice(0,4).map(move=>`<article><i class="${move.type}"></i><span><b>${esc(move.label||'Mouvement')}</b><small>${new Date(`${move.date}T12:00:00`).toLocaleDateString('fr-FR')} · ${move.type==='revenue'?'Revenu':'Dépense'}</small></span><strong>${move.type==='revenue'?'+':'-'}${euro.format(move.amount)}</strong></article>`).join(''):'<div class="dashboard-empty-row">Vos prochains mouvements apparaîtront ici.</div>'}
  function bindDashboardDetails(data,label){$$('[data-dashboard-total]',view).forEach(button=>button.onclick=()=>openDashboardDetails(data,label))}
  function updateDashboard(period,animate=true){dashboardPeriod=period;const data=dashboardSnapshot(),labels={week:'Semaine',month:'Mois',quarter:'Trimestre',year:'Année',all:'Tout'};$$('[data-dashboard-period]',view).forEach(button=>button.classList.toggle('on',button.dataset.dashboardPeriod===period));const number=$('[data-dashboard-number]',view);if(animate)animateDashboardNumber(number,data.profit);else number.textContent=euro.format(data.profit);$('[data-dashboard-period-copy]',view).textContent=`${labels[period]} · ${data.moves.length} mouvement${data.moves.length>1?'s':''}`;const revenueCount=data.moves.filter(move=>move.type==='revenue').length,expenseCount=data.moves.filter(move=>move.type==='expense').length;$('[data-dashboard-revenue]',view).textContent=euro.format(data.revenue);$('[data-dashboard-revenue-count]',view).textContent=`${revenueCount} entrée${revenueCount>1?'s':''}`;$('[data-dashboard-expense]',view).textContent=euro.format(data.expense);$('[data-dashboard-expense-count]',view).textContent=`${expenseCount} sortie${expenseCount>1?'s':''}`;$('[data-dashboard-closed]',view).textContent=data.closed;$('[data-dashboard-chart]',view).innerHTML=dashboardGraph(data.points);$('[data-dashboard-activity]',view).innerHTML=dashboardActivityHtml(data);bindDashboardDetails(data,labels[period])}
  function renderDashboard(animate=true){const pseudo=document.getElementById('accountName')?.textContent||'Utilisateur',labels={week:'Semaine',month:'Mois',quarter:'Trimestre',year:'Année',all:'Tout'};view.innerHTML=`<div class="v79-page dashboard-page"><header class="dashboard-head"><div><span class="v79-kicker">VUE GLOBALE</span><h1>Bonjour ${esc(pseudo)}</h1><p>Une lecture claire de l’ensemble de vos activités.</p></div><div class="dashboard-periods">${Object.entries(labels).map(([id,label])=>`<button class="${dashboardPeriod===id?'on':''}" data-dashboard-period="${id}">${label}</button>`).join('')}</div></header><section class="dashboard-hero dashboard-hero-open"><div class="dashboard-hero-orb" aria-hidden="true"></div><div class="dashboard-main-number"><span>RÉSULTAT GLOBAL</span><button type="button" data-dashboard-total><b data-dashboard-number>${euro.format(0)}</b><small data-dashboard-period-copy></small></button></div><div class="dashboard-summary"><article class="revenue"><span>Chiffre d’affaires</span><b data-dashboard-revenue>0 €</b><small data-dashboard-revenue-count></small></article><article class="expense"><span>Dépenses</span><b data-dashboard-expense>0 €</b><small data-dashboard-expense-count></small></article><article><span>Journées clôturées</span><b data-dashboard-closed>0</b><small>sur la période choisie</small></article></div><div class="dashboard-chart-wrap"><div class="dashboard-chart-title"><span>ÉVOLUTION</span><b>Performance cumulée</b></div><div data-dashboard-chart></div></div></section><div class="dashboard-lower"><section class="v79-glass dashboard-activity"><div class="dashboard-section-head"><div><span>ACTIVITÉ RÉCENTE</span><h2>Derniers mouvements</h2></div><button data-dashboard-total>Tout afficher</button></div><div data-dashboard-activity></div></section><section class="v79-glass dashboard-businesses"><div class="dashboard-section-head"><div><span>VOS ESPACES</span><h2>Business compatibles</h2></div></div><div class="dashboard-business-row"><i>U</i><span><b>UEFN</b><small>Création et revenus Fortnite</small></span></div><div class="dashboard-business-row"><i>G</i><span><b>Gambling</b><small>Jeux et sessions</small></span></div><div class="dashboard-business-row muted"><i>+</i><span><b>Ajouter un business</b><small>Étendre votre vue globale</small></span></div></section></div></div>`;if(animate)replay();$$('[data-dashboard-period]',view).forEach(button=>button.onclick=()=>updateDashboard(button.dataset.dashboardPeriod,true));updateDashboard(dashboardPeriod,true)}

  /* Série financière continue et graphique éditorial */
  function dashboardSnapshot(){loadCalendar();const start=dashboardPeriodStart(dashboardPeriod),moves=calState.transactions.filter(move=>!start||move.date>=start).sort((a,b)=>String(a.date).localeCompare(String(b.date))),revenue=moves.filter(move=>move.type==='revenue').reduce((sum,move)=>sum+Number(move.amount||0),0),expense=moves.filter(move=>move.type==='expense').reduce((sum,move)=>sum+Number(move.amount||0),0),byDay={};moves.forEach(move=>{byDay[move.date]=(byDay[move.date]||0)+(move.type==='revenue'?1:-1)*Number(move.amount||0)});let points=[];if(moves.length){const firstKey=start||moves[0].date,cursor=new Date(`${firstKey}T12:00:00`),end=new Date;while(cursor<=end){const key=dateKey(cursor);points.push([key,byDay[key]||0]);cursor.setDate(cursor.getDate()+1)}}return{moves,revenue,expense,profit:revenue-expense,points,closed:Object.keys(calState.closures).filter(key=>!start||key>=start).length}}
  function dashboardGraph(points){if(!points.length)return`<div class="dashboard-empty-chart"><span>Aucune donnée sur cette période</span><small>Les revenus et dépenses ajoutés au calendrier apparaîtront ici.</small></div>`;let running=0;const series=points.map(([date,value])=>({date,value,total:running+=value})),values=series.map(item=>item.total),min=Math.min(0,...values),max=Math.max(0,...values),range=max-min||1,left=44,right=674,top=33,bottom=160,width=right-left,coords=series.map((item,index)=>({x:left+index*(width/Math.max(1,series.length-1)),y:bottom-((item.total-min)/range)*(bottom-top),...item}));let curve=`M ${coords[0].x} ${coords[0].y}`;for(let index=1;index<coords.length;index++){const previous=coords[index-1],point=coords[index],middle=(previous.x+point.x)/2;curve+=` C ${middle} ${previous.y},${middle} ${point.y},${point.x} ${point.y}`}const area=`${curve} L ${coords.at(-1).x} ${bottom} L ${coords[0].x} ${bottom} Z`,labelStep=Math.max(1,Math.ceil(coords.length/6)),hitWidth=Math.max(5,width/Math.max(1,coords.length));return`<div class="dashboard-plot dashboard-plot-v3"><svg class="dashboard-chart" viewBox="0 0 720 202" preserveAspectRatio="none" role="img" aria-label="Évolution du résultat"><defs><linearGradient id="dashboardAreaEditorial" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#299cf0" stop-opacity=".19"/><stop offset=".72" stop-color="#299cf0" stop-opacity=".035"/><stop offset="1" stop-color="#299cf0" stop-opacity="0"/></linearGradient><linearGradient id="dashboardStrokeEditorial" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#69c9ff"/><stop offset=".48" stop-color="#258fdc"/><stop offset="1" stop-color="#1b77c1"/></linearGradient></defs><g class="dashboard-grid-v3"><line x1="${left}" y1="${top}" x2="${right}" y2="${top}"/><line x1="${left}" y1="${(top+bottom)/2}" x2="${right}" y2="${(top+bottom)/2}"/><line x1="${left}" y1="${bottom}" x2="${right}" y2="${bottom}"/></g>${coords.map((point,index)=>`<rect class="dashboard-day-bar ${point.value<0?'negative':''}" x="${point.x-Math.min(2.2,hitWidth*.18)}" y="${top}" width="${Math.min(4.4,hitWidth*.36)}" height="${bottom-top}" rx="2" style="--bar-opacity:${point.value===0?.055:.1+Math.min(.17,Math.abs(point.value)/Math.max(1,...series.map(item=>Math.abs(item.value)))*.17)}"/>`).join('')}<path d="${area}" class="dashboard-area-v3"/><path d="${curve}" class="dashboard-line-v3"/>${coords.map((point,index)=>`<g class="dashboard-hover-point"><rect x="${point.x-hitWidth/2}" y="${top-8}" width="${hitWidth}" height="${bottom-top+18}"/><line x1="${point.x}" y1="${top-4}" x2="${point.x}" y2="${bottom+3}"/><circle cx="${point.x}" cy="${point.y}" r="2.6"/><foreignObject x="${Math.max(5,Math.min(615,point.x-53))}" y="${Math.max(2,point.y-57)}" width="106" height="49"><div class="dashboard-tooltip-v3"><small>${new Date(`${point.date}T12:00:00`).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</small><b>${euro.format(point.total)}</b><em>${point.value>=0?'+':''}${euro.format(point.value)} ce jour</em></div></foreignObject>${index%labelStep===0||index===coords.length-1?`<text x="${point.x}" y="190" text-anchor="middle" class="dashboard-axis-label">${new Date(`${point.date}T12:00:00`).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}</text>`:''}</g>`).join('')}<text x="8" y="${top+3}" class="dashboard-value-label">${euro.format(max)}</text><text x="8" y="${bottom+3}" class="dashboard-value-label">${euro.format(min)}</text></svg></div>`}
  document.addEventListener('click',event=>{const button=event.target.closest('.nav-item[data-page="dashboard"]');if(!button)return;event.preventDefault();event.stopImmediatePropagation();syncNav(button);renderDashboard()},{capture:true});

  /* Interception fiable des onglets principaux */
  document.addEventListener('click',event=>{const button=event.target.closest('.nav-item[data-page]');if(!button)return;const page=button.dataset.page;if(!['calendar','marketing'].includes(page))return;event.preventDefault();event.stopImmediatePropagation();syncNav(button);if(page==='calendar')renderCalendar();if(page==='marketing')renderMarketing()},{capture:true});
  if(document.querySelector('.nav-item.active[data-page="dashboard"]'))renderDashboard();
})();
</script>
