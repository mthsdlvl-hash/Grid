        <button class="nav-item" type="button" data-page="information"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></svg><span class="nav-label">Informations</span></button>
        <button class="nav-item" type="button" data-page="patch"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span class="nav-label">Patch notes</span></button>
        <button class="nav-item" type="button" data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1v.1H9.5V21a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4 15a1.7 1.7 0 0 0-1.6-1H2.3V10h.1A1.7 1.7 0 0 0 4 9a1.7 1.7 0 0 0-.34-1.88L3.6 7.06 6.46 4.2l.06.06A1.7 1.7 0 0 0 8.4 4 1.7 1.7 0 0 0 9.5 2.4v-.1h4v.1A1.7 1.7 0 0 0 15 4a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.6 1h.1v4H21a1.7 1.7 0 0 0-1.6 1z"/></svg><span class="nav-label">Paramètres</span></button>
        <button class="nav-item" type="button" data-page="logout"><svg viewBox="0 0 24 24"><path d="M10 5H5v14h5M14 8l4 4-4 4m4-4H9"/></svg><span class="nav-label">Déconnexion</span></button>
      </nav>
      <button class="account" id="profileButton" type="button" aria-label="Ouvrir le profil utilisateur"><span class="avatar" id="navAvatar">U</span><span class="account-copy"><strong id="accountName">Utilisateur GRID</strong><small>Espace personnel</small></span></button>
    </aside>
    <section class="empty-space" aria-label="Espace de travail"><div class="workspace-view" id="workspaceView"></div></section>
    <section class="glass-panel" id="sidePanel" aria-hidden="true" aria-live="polite"></section>
    <div class="arrival" aria-hidden="true"></div>
  </main>
  <script>
    (()=>{
      const items=[...document.querySelectorAll('.nav-item')],rail=document.getElementById('activeRail'),name=document.getElementById('accountName'),panel=document.getElementById('sidePanel'),profileButton=document.getElementById('profileButton'),navAvatar=document.getElementById('navAvatar'),view=document.getElementById('workspaceView');
      const saved={theme:localStorage.getItem('grid_v771_theme')||'light',currency:localStorage.getItem('grid_v771_currency')||'EUR',notifications:localStorage.getItem('grid_v771_notifications')!=='off',animations:localStorage.getItem('grid_v771_animations')!=='off',privacy:localStorage.getItem('grid_v771_privacy')==='on'};
      let session=null;try{session=JSON.parse(sessionStorage.getItem('grid_session_v1')||'null')}catch(error){}if(session?.pseudo)name.textContent=session.pseudo;const savedPhoto=localStorage.getItem('grid_profile_photo_v1');if(savedPhoto){navAvatar.style.backgroundImage=`url(${savedPhoto})`;navAvatar.textContent=''}else navAvatar.textContent=(session?.pseudo||'U').slice(0,1).toUpperCase();
      const themeNames=['light','dark','green','amber','crimson','rose'];
      const applyTheme=theme=>{theme=theme==='red'?'crimson':theme==='pink'?'rose':theme;saved.theme=themeNames.includes(theme)?theme:'light';document.documentElement.dataset.theme=saved.theme;localStorage.setItem('grid_v771_theme',saved.theme)};applyTheme(saved.theme);
      const moveRail=item=>{const nav=document.querySelector('.side-nav'),r=item.getBoundingClientRect(),n=nav.getBoundingClientRect();rail.style.left=`${Math.round(r.left-n.left+(r.width-26)/2)}px`;rail.style.top='auto';rail.classList.add('ready')};
      const closePanel=()=>{panel.classList.remove('open');panel.setAttribute('aria-hidden','true')};
      const icon=name=>name==='settings'?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>';
      const row=(symbol,title,sub,control)=>`<div class="setting-row"><span class="setting-icon">${symbol}</span><span class="setting-copy"><b>${title}</b><small>${sub}</small></span>${control}</div>`;
      const settingsView=()=>{
        const sun='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',bell='<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>',coin='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 8.5c-.7-.6-1.6-.9-3-.9-1.7 0-3 .8-3 2.1 0 3.1 6 1.5 6 4.6 0 1.3-1.3 2.1-3 2.1-1.4 0-2.5-.4-3.2-1M12 5.5v13"/></svg>',motion='<svg viewBox="0 0 24 24"><path d="m5 12 4-4v8zM13 8l6 4-6 4z"/></svg>',shield='<svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6z"/></svg>',data='<svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>';
        panel.innerHTML=`<header class="panel-head"><span class="panel-emblem">${icon('settings')}</span><div><small>ESPACE GRID</small><h2>Paramètres</h2></div><button class="panel-close" data-panel-close aria-label="Fermer">×</button></header><section class="settings-section"><h3>Apparence</h3><div class="theme-picker-block"><span class="setting-icon">${sun}</span><span class="setting-copy"><b>Thème de l’interface</b><small>Les six ambiances historiques de GRID</small></span><div class="theme-grid" aria-label="Choisir le thème"><button data-theme-choice="light"><i></i><span>Clair</span></button><button data-theme-choice="dark"><i></i><span>Sombre</span></button><button data-theme-choice="green"><i></i><span>Émeraude</span></button><button data-theme-choice="amber"><i></i><span>Ambre</span></button><button data-theme-choice="crimson"><i></i><span>Rouge</span></button><button data-theme-choice="rose"><i></i><span>Rose</span></button></div></div>${row(motion,'Animations','Mouvements et transitions GRID',`<button class="switch ${saved.animations?'on':''}" data-setting="animations" aria-pressed="${saved.animations}"></button>`)}</section><section class="settings-section"><h3>Préférences</h3>${row(coin,'Devise principale','Format des chiffres financiers',`<select class="glass-select" data-currency><option>EUR</option><option>USD</option><option>GBP</option><option>CHF</option></select>`)}${row(bell,'Notifications','Alertes utiles dans GRID',`<button class="switch ${saved.notifications?'on':''}" data-setting="notifications" aria-pressed="${saved.notifications}"></button>`)}</section><section class="settings-section"><h3>Compte et sécurité</h3>${row(shield,'Confidentialité renforcée','Masquer les montants sensibles',`<button class="switch ${saved.privacy?'on':''}" data-setting="privacy" aria-pressed="${saved.privacy}"></button>`)}${row(data,'Données GRID','Sauvegarde locale du profil',`<button class="panel-action" data-export>Exporter</button>`)}</section>`;
        panel.querySelectorAll('[data-theme-choice]').forEach(button=>button.classList.toggle('on',button.dataset.themeChoice===saved.theme));const currency=panel.querySelector('[data-currency]');currency.value=saved.currency;currency.addEventListener('change',()=>{saved.currency=currency.value;localStorage.setItem('grid_v771_currency',saved.currency)});
        panel.querySelectorAll('[data-theme-choice]').forEach(button=>button.addEventListener('click',()=>{applyTheme(button.dataset.themeChoice);panel.querySelectorAll('[data-theme-choice]').forEach(node=>node.classList.toggle('on',node===button))}));
        panel.querySelectorAll('[data-setting]').forEach(button=>button.addEventListener('click',()=>{const key=button.dataset.setting;saved[key]=!saved[key];button.classList.toggle('on',saved[key]);button.setAttribute('aria-pressed',String(saved[key]));localStorage.setItem(`grid_v771_${key}`,saved[key]?'on':'off');if(key==='animations')document.documentElement.classList.toggle('no-motion',!saved[key])}));
        panel.querySelector('[data-export]').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:'7.7.1',settings:saved,profile:session||null},null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='GRID-parametres.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),500)});
      };
      const patchView=()=>{panel.innerHTML=`<header class="panel-head"><span class="panel-emblem">${icon('patch')}</span><div><small>NOUVEAUTÉS</small><h2>Patch notes</h2></div><button class="panel-close" data-panel-close aria-label="Fermer">×</button></header><p class="patch-intro">Toutes les évolutions importantes de GRID seront regroupées ici, version après version.</p><article class="patch-card"><time>VERSION 7.7.1</time><h3>Navigation liquid glass</h3><ul><li>Nouvelle barre latérale rétractable.</li><li>Synchronisation de l’indicateur actif.</li><li>Paramètres restaurés et mode sombre ajouté.</li><li>Animation de connexion issue de la version 7.6.0.</li></ul></article>`};
      const profileView=()=>{const photo=localStorage.getItem('grid_profile_photo_v1'),pseudo=session?.pseudo||'Utilisateur GRID';panel.innerHTML=`<header class="panel-head"><span class="panel-emblem">${icon('settings')}</span><div><small>COMPTE GRID</small><h2>Profil utilisateur</h2></div><button class="panel-close" data-panel-close aria-label="Fermer">×</button></header><div class="profile-hero"><span class="profile-photo" data-profile-photo style="${photo?`background-image:url(${photo})`:''}">${photo?'':pseudo.slice(0,1).toUpperCase()}</span><span><b>${pseudo}</b><small>Profil personnel GRID</small></span><button class="panel-action profile-upload" data-photo-trigger>Changer la photo</button><input data-photo-input type="file" accept="image/png,image/jpeg,image/webp" hidden></div><form class="profile-form" data-profile-form><label class="profile-field"><span>Nom d’utilisateur</span><input data-profile-name value="${pseudo.replace(/"/g,'&quot;')}" minlength="3" required></label><label class="profile-field"><span>Nouveau mot de passe</span><input data-profile-password type="password" minlength="6" placeholder="Laisser vide pour ne pas modifier"></label><label class="profile-field"><span>Confirmer le nouveau mot de passe</span><input data-profile-confirm type="password" minlength="6" placeholder="Répéter le mot de passe"></label><button class="profile-save" type="submit">Enregistrer les modifications</button><div class="profile-status" data-profile-status></div></form>`;
        const input=panel.querySelector('[data-photo-input]'),photoNode=panel.querySelector('[data-profile-photo]');panel.querySelector('[data-photo-trigger]').addEventListener('click',()=>input.click());input.addEventListener('change',()=>{const file=input.files?.[0];if(!file)return;if(file.size>5*1024*1024){panel.querySelector('[data-profile-status]').textContent='La photo doit faire moins de 5 Mo.';return}const reader=new FileReader();reader.onload=()=>{localStorage.setItem('grid_profile_photo_v1',reader.result);photoNode.style.backgroundImage=`url(${reader.result})`;photoNode.textContent='';navAvatar.style.backgroundImage=`url(${reader.result})`;navAvatar.textContent=''};reader.readAsDataURL(file)});
        panel.querySelector('[data-profile-form]').addEventListener('submit',async event=>{event.preventDefault();const statusNode=panel.querySelector('[data-profile-status]'),newPseudo=panel.querySelector('[data-profile-name]').value.trim(),newPassword=panel.querySelector('[data-profile-password]').value,confirm=panel.querySelector('[data-profile-confirm]').value;if(newPseudo.length<3){statusNode.textContent='Le nom doit contenir au moins 3 caractères.';return}if(newPassword&&newPassword.length<6){statusNode.textContent='Le mot de passe doit contenir au moins 6 caractères.';return}if(newPassword!==confirm){statusNode.textContent='Les mots de passe ne correspondent pas.';return}const newId=newPseudo.toLowerCase(),connectedAt=session?.connectedAt||new Date().toISOString();session={...(session||{}),id:newId,pseudo:newPseudo,connectedAt};sessionStorage.setItem('grid_session_v1',JSON.stringify(session));name.textContent=newPseudo;if(!localStorage.getItem('grid_profile_photo_v1'))navAvatar.textContent=newPseudo.slice(0,1).toUpperCase();let account={};try{account=JSON.parse(localStorage.getItem('grid_local_account_v1')||'{}')}catch(error){}account={...account,id:newId,pseudo:newPseudo};if(newPassword)account.passwordHash=await digestValue(newPassword);localStorage.setItem('grid_local_account_v1',JSON.stringify(account));let memory={};try{memory=JSON.parse(localStorage.getItem('grid_login_memory_v1')||'{}')}catch(error){}memory.pseudo=newPseudo;if(newPassword)memory.password=newPassword;localStorage.setItem('grid_login_memory_v1',JSON.stringify(memory));statusNode.textContent='Profil mis à jour.';panel.querySelector('.profile-hero b').textContent=newPseudo});
      };
      const digestValue=async value=>{const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));return[...new Uint8Array(bytes)].map(byte=>byte.toString(16).padStart(2,'0')).join('')};
      const oneGridView=()=>`<div class="page-top"><div><span class="page-kicker">ESPACE DOCUMENTAIRE</span><h1>OneGrid</h1><p>Vos catégories et vos fichiers réunis dans un espace clair.</p></div><div class="page-actions"><button class="glass-button">Importer</button><button class="glass-button primary">Nouveau dossier</button></div></div><div class="onegrid-layout"><aside class="glass-card category-panel"><div class="category-title">CATÉGORIES</div><button class="category-item on"><i class="category-dot"></i>Tous les fichiers</button><button class="category-item"><i class="category-dot" style="background:#8d75ff"></i>Fichiers par GRID</button><button class="category-item"><i class="category-dot" style="background:#59c990"></i>Documents</button></aside><section class="glass-card files-panel"><div class="files-head"><b>Mes fichiers</b><small>3 dossiers</small></div><div class="folder-grid"><article class="folder-card"><div class="folder-shape"></div><b>Fichiers par GRID</b><small>Bilans et documents générés</small></article><article class="folder-card"><div class="folder-shape" style="filter:hue-rotate(38deg)"></div><b>Documents</b><small>Vos fichiers importés</small></article><article class="folder-card"><div class="folder-shape" style="filter:hue-rotate(78deg)"></div><b>Archives</b><small>Éléments conservés</small></article></div></section></div>`;
      const toolsView=()=>`<div class="page-top"><div><span class="page-kicker">CRÉATION ET PRODUCTIVITÉ</span><h1>Outils intégrés</h1><p>Les outils GRID accessibles sans quitter votre espace de travail.</p></div></div><div class="tool-grid"><article class="glass-card tool-card"><div class="tool-visual"><span class="tool-symbol">◈</span></div><h3>Matériaux Maker</h3><p>Préparez et organisez vos matériaux pour vos créations UEFN.</p><span>Ouvrir l’outil →</span></article><article class="glass-card tool-card"><div class="tool-visual"><span class="tool-symbol">✦</span></div><h3>Remove Background</h3><p>Détourez proprement vos images et conservez leur définition originale.</p><span>Ouvrir l’outil →</span></article><article class="glass-card tool-card"><div class="tool-visual"><span class="tool-symbol">⌘</span></div><h3>Cartes mentales</h3><p>Structurez vos idées, reliez les étapes et construisez vos projets.</p><span>Ouvrir l’outil →</span></article></div>`;
      const renderPage=page=>{view.innerHTML=page==='onegrid'?oneGridView():page==='tools'?toolsView():'';if(view.innerHTML)view.animate([{opacity:0,transform:'translateY(15px) scale(.99)',filter:'blur(8px)'},{opacity:1,transform:'none',filter:'none'}],{duration:saved.animations?620:1,easing:'cubic-bezier(.18,.86,.2,1)',fill:'both'})};
      const openPanel=type=>{if(type==='settings')settingsView();else if(type==='profile')profileView();else patchView();panel.querySelector('[data-panel-close]').addEventListener('click',closePanel);panel.classList.add('open');panel.setAttribute('aria-hidden','false')};
      items.forEach(item=>item.addEventListener('click',()=>{const page=item.dataset.page;if(page==='logout'){sessionStorage.removeItem('grid_session_v1');location.assign('GRID_v7.9.0_Functional_Suite.html');return}items.forEach(node=>node.classList.remove('active'));item.classList.add('active');moveRail(item);if(page==='settings'||page==='patch')openPanel(page);else{closePanel();renderPage(page)}}));
      profileButton.addEventListener('click',()=>openPanel('profile'));
      document.addEventListener('pointerdown',event=>{if(!panel.classList.contains('open')||panel.contains(event.target)||event.target.closest('#profileButton,.nav-item[data-page="settings"],.nav-item[data-page="patch"]'))return;closePanel()});
      document.addEventListener('keydown',event=>{if(event.key==='Escape')closePanel()});
      addEventListener('resize',()=>{const active=document.querySelector('.nav-item.active');if(active)moveRail(active)});requestAnimationFrame(()=>{const active=document.querySelector('.nav-item.active');if(active)moveRail(active)});
    })();
  </script>
<script src="grid-v79-functional.js?v=7990"></script>
</body>
</html>
